name: Publish site

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check angie0angie.is-a.dev
        id: domain
        run: |
          html=$(curl -fsSL --max-time 20 "https://angie0angie.is-a.dev" || curl -fsSL --max-time 20 "http://angie0angie.is-a.dev" || true)
          if printf '%s' "$html" | grep -q "Angelica Chowdhury"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Custom domain is up. Skipping Nekoweb."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Custom domain is not serving the site. Deploying to Nekoweb."
          fi

      - name: Checkout code
        if: steps.domain.outputs.available != 'true'
        uses: actions/checkout@v4

      - name: Prepare site files
        if: steps.domain.outputs.available != 'true'
        run: |
          mkdir site
          cp index.html style.css site/
          cp -r photos site/photos

      - name: Deploy to Nekoweb
        if: steps.domain.outputs.available != 'true'
        uses: indiefellas/deploy2nekoweb@main
        with:
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: angie0angie.nekoweb.org
          nekoweb-username: angie0angie
          directory: site
